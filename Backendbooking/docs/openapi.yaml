components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT App Maker, member, admin_space, atau Guru/Penguji sesuai endpoint.
    makerKey:
      type: apiKey
      in: header
      name: x-maker-key
      description: Tenant key utama.
    appKey:
      type: apiKey
      in: header
      name: x-app-key
      description: Alias kompatibilitas untuk x-maker-key; bila keduanya ada harus sama.
  headers:
    XPage:
      description: Nomor halaman efektif (1-based).
      schema: { type: integer, minimum: 1 }
    XPerPage:
      description: Batas efektif item per halaman.
      schema: { type: integer, minimum: 1, maximum: 100 }
    XTotalCount:
      description: Jumlah total item yang cocok sebelum pagination.
      schema: { type: integer, minimum: 0 }
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PositiveId' }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Month:
      name: month
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 12 }
    Year:
      name: year
      in: query
      required: false
      schema: { type: integer, minimum: 2000, maximum: 2100 }
  responses:
    BadRequest:
      description: Input/header tidak valid atau aturan bisnis dasar gagal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { status: false, statusCode: 400, message: Permintaan tidak valid, error: Bad Request, timestamp: '2026-08-27T08:00:00.000Z' }
    Unauthorized:
      description: Credential hilang atau invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Role/ownership/state tidak mengizinkan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource tidak ada atau disamarkan karena scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Duplicate, overlap, stale write, atau transisi ilegal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: File melebihi 5 MiB
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limit terlampaui
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          description: Detik sebelum mencoba kembali
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Kegagalan internal tanpa stack/SQL/secret
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    PositiveId:
      type: integer
      format: int64
      minimum: 1
      example: 1
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Nominal integer Rupiah (IDR)
      example: 25000
    DateOnly:
      type: string
      format: date
      example: '2026-08-30'
    TimeHHmm:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '09:00'
    SpaceType:
      type: string
      enum: [desk, meeting_room, private_office]
    UserRole:
      type: string
      enum: [member, admin_space]
    ReservationStatus:
      type: string
      enum: [belum_dikonfirm, disetujui, aktif, selesai, dibatalkan]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [status, statusCode, message, error, timestamp]
      properties:
        status: { type: boolean, enum: [false] }
        statusCode: { type: integer, enum: [400, 401, 403, 404, 409, 413, 429, 500] }
        message: { type: string }
        error: { type: string }
