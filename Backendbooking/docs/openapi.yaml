openapi: 3.0.3
info:
  title: Smart Space Booking API
  version: 1.0.0
  description: |
    Kontrak 50 operasi UKK Paket B. Semua data bisnis tenant-scoped.
    x-maker-key dan x-app-key adalah alias; jika keduanya hadir nilainya harus sama.
    Kontrak ini sengaja memperketat upload menjadi bearer-only, melindungi maker/list,
    menggunakan QR opaque tanpa app key, dan mempertahankan body array collection dengan
    metadata pagination pada X-Page/X-Per-Page/X-Total-Count. Lihat api-contract.md untuk conflict log.
servers:
  - url: https://learn.smktelkom-mlg.sch.id/coworking
    description: Base URL contoh sumber UKK
  - url: http://localhost:3000
    description: Development lokal
tags:
  - name: System
  - name: Maker
  - name: Auth
  - name: Spaces
  - name: Discounts
  - name: Reservations
  - name: Admin Profile
  - name: Admin Members
  - name: Admin Spaces
  - name: Admin Discounts
  - name: Admin Reservations
  - name: Reports
  - name: Uploads
paths:
  /:
    get:
      tags: [System]
      operationId: getApiRoot
      summary: Status API dan petunjuk penggunaan
      security: []
      responses:
        '200':
          description: API online
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootResponse'
              example:
                status: true
                statusCode: 200
                message: Berhasil memproses permintaan
                data:
                  name: Coworking Space Backend API - UKK RPL Paket B
                  version: 1.0.0
                  status: online
                  swagger_docs: /docs
                  description: Backend Smart Space Booking
                  documentation_links:
                    swagger: https://api.example.test/docs
                    swagger_json: https://api.example.test/docs-json
                timestamp: '2026-08-27T08:34:46.977Z'
        '500': { $ref: '#/components/responses/InternalError' }
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness server
      security: []
      responses:
        '200':
          description: Proses hidup
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/maker/register:
    post:
      tags: [Maker]
      operationId: registerMaker
      summary: Registrasi App Maker dan generate app key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterMakerDto' }
      responses:
        '201':
          description: Maker dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MakerAuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/maker/login:
    post:
      tags: [Maker]
      operationId: loginMaker
      summary: Login App Maker
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginMakerDto' }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MakerAuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/maker/me:
    get:
      tags: [Maker]
      operationId: getCurrentMaker
      summary: Profil App Maker saat ini
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil maker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MakerProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/maker/stats:
    get:
      tags: [Maker]
      operationId: getMakerStats
      summary: Statistik data tenant App Maker
      security:
        - bearerAuth: []
        - makerKey: []
        - appKey: []
      responses:
        '200':
          description: Statistik tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MakerStatsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/maker/list:
    get:
      tags: [Maker]
      operationId: listMakersForExaminer
      summary: Daftar App Maker untuk Guru/Penguji
      description: Ekstensi keamanan; sumber menyebut publik, kontrak ini mewajibkan bearer Guru/Penguji dan meredaksi credential.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Daftar maker teredaksi
          headers:
            X-Page: { $ref: '#/components/headers/XPage' }
            X-Per-Page: { $ref: '#/components/headers/XPerPage' }
            X-Total-Count: { $ref: '#/components/headers/XTotalCount' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MakerListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/register/member:
    post:
      tags: [Auth]
      operationId: registerMember
      summary: Registrasi member dalam tenant
      security:
        - makerKey: []
        - appKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterMemberDto' }
      responses:
        '201':
          description: Member dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterMemberAuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/register/admin-space:
    post:
      tags: [Auth]
      operationId: registerAdminSpace
      summary: Registrasi admin dan profil coworking
      security:
        - makerKey: []
        - appKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAdminSpaceDto' }
      responses:
        '201':
          description: Admin dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterAdminAuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Login member atau admin dalam tenant
      security:
        - makerKey: []
        - appKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginDto' }
      responses:
        '200':
          description: Login berhasil; profil role terkait dapat null/absent sesuai data sumber dan toleransi frontend
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginUserAuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/profile:
    get:
      tags: [Auth]
      operationId: getCurrentUserProfile
      summary: Profil user login
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      responses:
        '200':
          description: Profil user; hanya profil role terkait yang wajib, profil lain dapat null/absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/spaces/types:
    get:
      tags: [Spaces]
      operationId: listSpaceTypes
      summary: Daftar tipe space
      security:
        - makerKey: []
        - appKey: []
      responses:
        '200':
          description: Tiga tipe space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceTypeListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/spaces/availability:
    get:
      tags: [Spaces]
      operationId: checkSpaceAvailability
      summary: Cek availability advisory
      security:
        - makerKey: []
        - appKey: []
      parameters:
        - name: id_space
          in: query
          required: true
          schema: { $ref: '#/components/schemas/PositiveId' }
        - name: tanggal
          in: query
          required: true
          schema: { $ref: '#/components/schemas/DateOnly' }
        - name: jam_mulai
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TimeHHmm' }
        - name: durasi_jam
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Hasil availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/spaces:
    get:
      tags: [Spaces]
      operationId: listPublicSpaces
      summary: Katalog space tenant
      security:
        - makerKey: []
        - appKey: []
      parameters:
        - name: tipe
          in: query
          schema: { $ref: '#/components/schemas/SpaceType' }
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Daftar space
          headers:
            X-Page: { $ref: '#/components/headers/XPage' }
            X-Per-Page: { $ref: '#/components/headers/XPerPage' }
            X-Total-Count: { $ref: '#/components/headers/XTotalCount' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/spaces/{id}:
    get:
      tags: [Spaces]
      operationId: getPublicSpaceById
      summary: Detail space
      security:
        - makerKey: []
        - appKey: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Detail space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/diskon/active:
    get:
      tags: [Discounts]
      operationId: listActiveDiscounts
      summary: Daftar promo aktif
      security:
        - makerKey: []
        - appKey: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Promo aktif
          headers:
            X-Page: { $ref: '#/components/headers/XPage' }
            X-Per-Page: { $ref: '#/components/headers/XPerPage' }
            X-Total-Count: { $ref: '#/components/headers/XTotalCount' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscountListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/diskon/check:
    post:
      tags: [Discounts]
      operationId: checkDiscountCode
      summary: Validasi kode promo
      security:
        - makerKey: []
        - appKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckPromoDto' }
      responses:
        '200':
          description: Promo valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscountCheckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/diskon/{id}:
    get:
      tags: [Discounts]
      operationId: getPublicDiscountById
      summary: Detail diskon
      security:
        - makerKey: []
        - appKey: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Detail diskon
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reservasi:
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Membuat reservasi member secara atomik
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservationDto' }
      responses:
        '201':
          description: Reservasi dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reservasi/my:
    get:
      tags: [Reservations]
      operationId: listMyReservations
      summary: Daftar reservasi member sendiri
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Reservasi sendiri
          headers:
            X-Page: { $ref: '#/components/headers/XPage' }
            X-Per-Page: { $ref: '#/components/headers/XPerPage' }
            X-Total-Count: { $ref: '#/components/headers/XTotalCount' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationSummaryListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reservasi/my/history:
    get:
      tags: [Reservations]
      operationId: getMyReservationHistory
      summary: Histori reservasi member per bulan
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      parameters:
        - { $ref: '#/components/parameters/Month' }
        - { $ref: '#/components/parameters/Year' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Histori bulanan; data.items tetap array source-compatible
          headers:
            X-Page: { $ref: '#/components/headers/XPage' }
            X-Per-Page: { $ref: '#/components/headers/XPerPage' }
            X-Total-Count: { $ref: '#/components/headers/XTotalCount' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationHistoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reservasi/{id}/e-ticket:
    get:
      tags: [Reservations]
      operationId: getReservationETicket
      summary: E-ticket reservasi dan inspeksi tiket sebelum check-in
      description: QR memakai token opaque/signed dan tidak memuat app key seperti contoh sumber. Jalur scan/validate wajib menginspeksi e-ticket ini dalam scope admin/member yang sah, lalu admin memanggil EP-044 menggunakan id reservasi yang cocok; endpoint QR verify khusus tetap optional.
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: E-ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ETicketResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reservasi/{id}:
    get:
      tags: [Reservations]
      operationId: getReservationById
      summary: Detail reservasi untuk pemilik atau admin owner
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Detail reservasi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reservasi/{id}/cancel:
    patch:
      tags: [Reservations]
      operationId: cancelMyReservation
      summary: Membatalkan reservasi member
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Reservasi dibatalkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/admin/profile:
    get:
      tags: [Admin Profile]
      operationId: getAdminCoworkingProfile
      summary: Profil coworking admin
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      responses:
        '200':
          description: Profil owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Admin Profile]
      operationId: updateAdminCoworkingProfile
      summary: Update profil coworking admin
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCoworkingProfileDto' }
      responses:
        '200':
          description: Profil diperbarui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/admin/members:
    get:
      tags: [Admin Members]
      operationId: listAdminMembers
      summary: Daftar member tenant
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      parameters:
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Daftar member
          headers:
            X-Page: { $ref: '#/components/headers/XPage' }
            X-Per-Page: { $ref: '#/components/headers/XPerPage' }
            X-Total-Count: { $ref: '#/components/headers/XTotalCount' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin Members]
      operationId: createAdminMember
      summary: Tambah member oleh admin
      security:
        - bearerAuth: []
          makerKey: []
        - bearerAuth: []
          appKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMemberAdminDto' }
      responses:
        '201':
          description: Member dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/admin/members/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
    get:
      tags: [Admin Members]
      operationId: getAdminMemberById
      summary: Detail member
      security:
