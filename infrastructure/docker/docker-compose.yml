services:
  database:
    image: mariadb:10.11
    container_name: ssb-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bookingin_dev
      MYSQL_USER: ssb_user
      MYSQL_PASSWORD: ssb_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ../../Backendbooking
      dockerfile: Dockerfile
    container_name: ssb-backend
    restart: unless-stopped
    depends_on:
      - database
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "mysql://ssb_user:ssb_password@database:3306/bookingin_dev"
      JWT_SECRET: "replace-with-at-least-32-characters-cryptographically-secure"
      JWT_EXPIRATION: "1d"
      CORS_ALLOWED_ORIGINS: "http://localhost:3100"
      TRUST_PROXY: "1"
      STORAGE_DRIVER: "local"
      LOCAL_UPLOAD_DIR: "uploads"
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ../../Frontendbooking
      dockerfile: Dockerfile
    container_name: ssb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3100
      BACKEND_API_URL: "http://backend:3000"
    ports:
      - "3100:3100"

volumes:
  db_data:
  uploads_data:
