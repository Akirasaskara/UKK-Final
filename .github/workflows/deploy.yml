name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -e
          test -n "$EC2_HOST" || { echo "EC2_HOST is empty"; exit 1; }
          test -n "$EC2_USER" || { echo "EC2_USER is empty"; exit 1; }
          test -n "$EC2_SSH_PRIVATE_KEY" || { echo "EC2_SSH_PRIVATE_KEY is empty"; exit 1; }
          first_line="$(printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | sed -n '1p')"
          case "$first_line" in
            "-----BEGIN "*PRIVATE" KEY-----")
              echo "SSH key header valid"
              ;;
            *)
              echo "EC2_SSH_PRIVATE_KEY is not a PEM/OpenSSH private key"
              exit 1
              ;;
          esac
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euxo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/home/ubuntu/UKK-Final"; fi
            echo "Deploy dir: $APP_DIR"
            cd "$APP_DIR/Backendbooking"
            git pull --ff-only origin main
            node --version; npm --version
            test -f package-lock.json
            npm ci --loglevel verbose
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart bookingin-backend --update-env || pm2 start ecosystem.config.cjs 2>/dev/null || pm2 restart all --update-env
            sleep 5
            curl -fsS ${{ secrets.HEALTHCHECK_URL }}/health
            curl -fsS ${{ secrets.HEALTHCHECK_URL }}/ready
            cd ../Frontendbooking
            git pull --ff-only origin main
            node --version; npm --version
            test -f package-lock.json
            npm ci --loglevel verbose
            rm -rf .next
            npm run build
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public
            cp .env.production .next/standalone/.env.production
            pm2 restart bookingin-frontend --update-env || pm2 delete bookingin-frontend; pm2 start ecosystem.config.cjs; pm2 save
            sleep 3
            curl -fsS ${{ secrets.FRONTEND_URL }}/ | head -5
