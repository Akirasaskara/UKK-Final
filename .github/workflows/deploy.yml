name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/home/ubuntu/UKK-Final"; fi
            echo "Deploy dir: $APP_DIR"
            cd "$APP_DIR/Backendbooking"
            git pull origin main
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart bookingin-backend --update-env || pm2 start ecosystem.config.cjs 2>/dev/null || pm2 restart all --update-env
            sleep 5
            curl -fsS https://api.fallingforyou.my.id/health
            curl -fsS https://api.fallingforyou.my.id/ready
            cd ../Frontendbooking
            git pull origin main
            npm ci
            rm -rf .next
            npm run build
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public
            cp .env.production .next/standalone/.env.production
            pm2 restart bookingin-frontend --update-env || pm2 delete bookingin-frontend; pm2 start ecosystem.config.cjs; pm2 save
            sleep 3
            curl -fsS https://fallingforyou.my.id/ | head -5
