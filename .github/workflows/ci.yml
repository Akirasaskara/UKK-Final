name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backendbooking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
        env:
          DATABASE_URL: mysql://test:test@localhost:3306/test
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontendbooking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
        env:
          BACKEND_API_URL: http://localhost:3000
          APP_URL: http://localhost:3000
